<!DOCTYPE html>
<html>
<head>
    <title>3D Sphere with Panels</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hamburger-icon">&#9776;</div> 
    <div id="hamburger-menu" class="menu">
        <ul id="menu-panel-list">
            <!-- Panel titles will be populated by JS -->
        </ul>
    </div>
    <canvas id="sphereCanvas"></canvas>
    <div id="nav-arrows">
        <button id="arrow-up">&#8593;</button> <!-- Up Arrow -->
        <div>
            <button id="arrow-left">&#8592;</button> <!-- Left Arrow -->
            <button id="arrow-down">&#8595;</button> <!-- Down Arrow -->
            <button id="arrow-right">&#8594;</button> <!-- Right Arrow -->
        </div>
    </div>
    <div id="popup" class="popup" style="display:none;">
        <div class="popup-content">
            <span class="close-button">&times;</span>
            <p id="popupText"></p>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
